name: Feature request / 功能建议
description: A model, a workflow or an option you would like / 希望支持的模型、流程或选项
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do / 想解决什么
      description: The situation, not the solution. 先说场景，不急着说方案。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind / 设想的做法
